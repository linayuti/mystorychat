<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Переписка</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f2f7;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}.phone{width:min(100%,430px);height:100vh;max-height:900px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 25px #0001}.header{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #e8e8ec}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#d8b4fe,#818cf8);display:grid;place-items:center;color:white;font-weight:700}.name{font-weight:650}.status{font-size:12px;color:#8b8b93;margin-top:2px}.messages{flex:1;overflow-y:auto;padding:18px 14px;background:#f7f7f9;display:flex;flex-direction:column;gap:8px}.day{align-self:center;color:#8b8b93;background:#e5e5ea;padding:4px 10px;border-radius:12px;font-size:11px;margin-bottom:5px}.message{max-width:78%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap}.received{align-self:flex-start;background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 2px #0001}.sent{align-self:flex-end;background:#d9fdd3;border-bottom-right-radius:5px}.time{display:block;text-align:right;font-size:10px;color:#8b8b93;margin-top:4px}.composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:9px 10px;background:#fff;border-top:1px solid #e8e8ec}#messageInput{flex:1;min-width:0;max-height:120px;resize:none;border:1px solid #d9d9df;border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;outline:none;background:#f7f7f9}#sendButton{width:42px;height:42px;border:0;border-radius:50%;background:#111827;color:#fff;font-size:18px;cursor:pointer}.hint{text-align:center;color:#9999a2;font-size:11px;padding:2px 0 7px;background:#fff}@media(min-width:600px){body{padding:20px}.phone{height:min(900px,calc(100vh - 40px));border-radius:22px}}
</style></head>
<body><main class="phone"><header class="header"><div class="avatar">А</div><div><div class="name">Переписка</div><div class="status">в сети</div></div></header><section class="messages" id="messages"><div class="day">Сегодня</div><div class="message received">Привет! Как дела?<span class="time">20:14</span></div><div class="message sent">Привет! Всё хорошо 😊<span class="time">20:15</span></div></section><div class="hint">Сообщения сохраняются только на этой странице</div><form class="composer" id="composer"><textarea id="messageInput" rows="1" placeholder="Написать сообщение..."></textarea><button id="sendButton" type="submit">➤</button></form></main>
<script>const f=document.getElementById('composer'),i=document.getElementById('messageInput'),m=document.getElementById('messages');function add(t){t=t.trim();if(!t)return;const d=document.createElement('div');d.className='message sent';d.appendChild(document.createTextNode(t));const s=document.createElement('span');s.className='time';s.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});d.appendChild(s);m.appendChild(d);m.scrollTop=m.scrollHeight;i.value='';i.style.height='auto'}f.addEventListener('submit',e=>{e.preventDefault();add(i.value)});i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add(i.value)}});i.addEventListener('input',()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'});m.scrollTop=m.scrollHeight;</script></body></html>
