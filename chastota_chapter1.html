<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Частота — Глава 1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#e9edf3;font-family:Georgia,"Times New Roman",serif}.game{max-width:900px;min-height:100vh;margin:auto;background:#0c111a;display:flex;flex-direction:column}header{padding:22px;border-bottom:1px solid #303a4b;background:#0c111a;position:sticky;top:0;z-index:3}.chapter,.subtitle,.name,.note,.scene-title,.scene-hint{font-family:Arial,sans-serif}.chapter{color:#8997aa;font-size:12px;letter-spacing:2px;text-transform:uppercase}h1{font-size:38px;font-weight:normal;margin:8px 0}.subtitle{font-size:12px;color:#8796aa}.progress{height:3px;background:#202b3a}.progress span{display:block;height:100%;width:0;background:#b5c4d7;transition:width .3s}.scene{padding:15px 20px;background:#151d29;border-bottom:1px solid #303a4b}.scene-card{min-height:150px;padding:22px;border:1px dashed #59677a;border-radius:10px;text-align:center;background:linear-gradient(145deg,#1b2737,#0d131d);display:flex;flex-direction:column;justify-content:center}.scene-title{font-size:12px;letter-spacing:2px;color:#aebdd0;text-transform:uppercase;margin-bottom:9px}.scene-description{line-height:1.55;color:#c8d1dd}.scene-hint{font-size:12px;color:#8493a7;margin-top:10px}.story{padding:23px 18px;flex:1}.narrator{max-width:780px;margin:0 auto 22px;line-height:1.75;white-space:pre-wrap;color:#d7dde6}.dialogue,.user-message{max-width:780px;margin:0 auto 18px;display:flex;gap:11px;align-items:flex-start}.avatar{width:46px;height:46px;min-width:46px;border-radius:50%;border:1px solid #536176;background:#18202d;display:flex;align-items:center;justify-content:center;color:#b5c4d5;font:9px Arial,sans-serif;text-align:center}.dialogue-text{background:#121a25;border-left:3px solid #718198;padding:12px 15px;border-radius:0 10px 10px 0;line-height:1.65;min-width:0}.name{color:#aeb9c9;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}.user-message{justify-content:flex-end}.user-message .avatar{order:2}.user-message .dialogue-text{order:1;background:#202b3b;border-left:0;border-right:3px solid #91a6c0;border-radius:10px 0 0 10px;max-width:78%}.user-message .name{text-align:right}.system-note{text-align:center;color:#8190a4;font:12px Arial,sans-serif;margin:12px auto 20px;line-height:1.5}.input-area{position:sticky;bottom:0;padding:12px;background:#0d131d;border-top:1px solid #303a4b;z-index:3}form{display:flex;gap:9px}textarea{flex:1;min-height:54px;resize:vertical;background:#080c13;color:white;border:1px solid #3d4a5d;border-radius:11px;padding:13px;font:16px Georgia,serif;outline:none}button{border:1px solid #c7d0dc;border-radius:11px;padding:0 16px;background:#e2e8f0;color:#11151c;font:15px Georgia,serif}.note{display:flex;justify-content:space-between;gap:8px;color:#78879a;font-size:11px;margin-top:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.actions button{background:transparent;color:#9eacbe;border-color:#354458;padding:7px 10px;font:12px Arial,sans-serif}button:disabled,textarea:disabled{opacity:.45}@media(max-width:560px){header{padding:16px}h1{font-size:32px}.scene{padding:10px}.story{padding:18px 11px}.avatar{width:37px;height:37px;min-width:37px;font-size:8px}.dialogue-text{padding:10px 12px}.input-area{padding:9px}button{padding:0 11px}}
</style></head><body><div class="game">
<header><div class="chapter">Глава 1 · Интерактивная история</div><h1>«Частота»</h1><div class="subtitle">Пиши своими словами. Готовых вариантов нет.</div></header>
<div class="progress"><span id="bar"></span></div>
<section class="scene"><div class="scene-card"><div class="scene-title" id="sceneTitle"></div><div class="scene-description" id="sceneDesc"></div><div class="scene-hint" id="sceneHint"></div></div></section>
<section class="story" id="story" aria-live="polite"></section>
<div class="input-area"><form id="form"><textarea id="input" placeholder="Что скажет или сделает Лина?"></textarea><button id="send" type="submit">Отправить</button></form><div class="note"><span>Enter — отправить · Shift+Enter — новая строка</span><span id="counter"></span></div><div class="actions"><button id="save" type="button">Сохранить сейчас</button><button id="restart" type="button">Начать заново</button></div></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),story=$('story'),input=$('input'),KEY='chastota_save_v3';
const scenes=[
['Дорога к станции','Прибрежная дорога, холодный ветер и здание, которого нет на современных картах.','Поговори с друзьями или осмотрись.'],
['Ворота','Ржавые ворота приоткрыты. Свежие следы ведут внутрь, но обратных следов почти нет.','Можно проверить следы, табличку или позвать кого-нибудь.'],
['Вход','На двери выцарапано: «НЕ ОТВЕЧАТЬ». Изнутри доносятся три тихих удара.','Прислушайся, постучи или осмотри замок.'],
['Главный коридор','Пахнет солью, пылью и мокрым металлом. На стенах — выцветшие номера помещений.','Реши, что осмотреть и как держаться вместе.'],
['Радиорубка','Кабели оборваны, электричества нет, но на старом приёмнике горит красный индикатор.','Обратись к радио, изучи аппаратуру или поговори с друзьями.'],
['Кассета № 15','В ящике находится кассета с номером 15 и старый магнитофон.','Можно включить запись или сначала осмотреть кассету.'],
['Архив','В шкафах — журналы наблюдений. На одном ящике видна свежая царапина.','Ищи документы, карту или следы недавнего присутствия.'],
['Карта станции','На плане красным карандашом обведён «ЗАЛ 4». На новой схеме этого помещения нет.','Изучи маршрут и реши, куда двигаться дальше.'],
['Комната B-17','На двери табличка B-17. Найденный ключ помечен такой же маркировкой.','Можно открыть дверь, осмотреть её или подождать.'],
['Старая фотография','На столе снимок четырёх исследователей. На обороте: «ПОСЛЕДНЯЯ ГРУППА».','Рассмотри снимок и надпись на обороте.'],
['Отчёт группы № 15','Одно имя в документах соскоблено. Последние страницы влажные, словно их недавно держали в руках.','Ищи даты, имена и упоминания сигнала.'],
['Станция просыпается','Щёлкает реле. Лампы вспыхивают одна за другой, хотя электричества не должно быть.','Соберитесь вместе или попробуйте вернуться.'],
['Голос в эфире','Радио включается само: «Вы нашли комнату. Вы нашли фотографию. Не открывайте зал четыре».','Задай голосу вопрос или обсуди услышанное.'],
['Скрытый проход','За отодвинутым шкафом открылась лестница вниз. Снизу тянет холодом и доносится гул.','Можно спуститься или сначала проверить лестницу.'],
['Акустическая камера','Под станцией круглый зал с металлическими отражателями. В центре стоит диктофон.','Осмотри диктофон и помещение.'],
['Голоса на записи','На диктофоне файл с сегодняшней датой. Из тишины доносятся голоса, похожие на ваши.','Прослушай запись, останови её или ответь на услышанное.'],
['Выход закрыт','Тяжёлая дверь захлопнулась. Ручка не двигается, а в коридоре погас свет.','Найди выход, поддержи друзей или обратись к радио.'],
['Последний сигнал','В темноте радио произносит имя Лины. Из-за двери доносятся шаги — и три знакомых удара.','Последнее действие Лины перед концом главы.']
];
let stage=0,turns=0,ended=false,history=[];
function update(){let s=scenes[Math.min(stage,scenes.length-1)];$('sceneTitle').textContent=s[0];$('sceneDesc').textContent=s[1];$('sceneHint').textContent=s[2];$('bar').style.width=(stage/(scenes.length-1)*100)+'%';$('counter').textContent='Сообщение '+turns+' · сцена '+(stage+1)+' из '+scenes.length}
function scroll(el){setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),30)}
function narrator(t){let e=document.createElement('div');e.className='narrator';e.textContent=t;story.appendChild(e);scroll(e);history.push({kind:'n',text:t})}
function line(name,t){let e=document.createElement('div');e.className='dialogue';e.innerHTML='<div class="avatar"></div><div class="dialogue-text"><div class="name"></div><div class="words"></div></div>';e.querySelector('.avatar').textContent=name.toUpperCase();e.querySelector('.name').textContent=name;e.querySelector('.words').textContent=t;story.appendChild(e);scroll(e);history.push({kind:'c',name,text:t})}
function user(t){let e=document.createElement('div');e.className='user-message';e.innerHTML='<div class="avatar">ЛИНА</div><div class="dialogue-text"><div class="name">Лина · ты</div><div class="words"></div></div>';e.querySelector('.words').textContent=t;story.appendChild(e);scroll(e);history.push({kind:'u',text:t})}
function note(t){let e=document.createElement('div');e.className='system-note';e.textContent=t;story.appendChild(e)}
function has(t,a){return a.some(x=>t.includes(x))}
function reply(raw){
let t=raw.toLocaleLowerCase('ru'),r=[];
switch(stage){
case 0:
 if(has(t,['страш','боюсь','жутк']))r.push(['Аня','Мне тоже не по себе. Договоримся: если станет опасно, сразу уходим.']);
 else if(has(t,['зачем','почему','сигнал','цель']))r.push(['Марк','Сигнал повторяется каждые двадцать три минуты. Его источник почему-то ведёт сюда.']);
 else if(has(t,['уйти','назад','домой']))r.push(['Кирилл','Мы можем развернуться. Но давай хотя бы посмотрим на ворота и решим вместе.']);
 else r.push(['Марк','На современных картах станции нет. Но координаты сигнала точные.']);
 r.push(['Кирилл','Держимся рядом. Никаких одиночных походов.']);break;
case 1:
 if(has(t,['след','отпечат','свеж']))r.push(['Кирилл','Следы действительно свежие. И странно, что они ведут внутрь, а обратных почти нет.']);
 else if(has(t,['таблич','надпис','не отвечать']))r.push(['Аня','Здесь написано: «НЕ ОТВЕЧАТЬ». Не самое дружелюбное приветствие.']);
 else if(has(t,['крик','позвать','эй']))r.push(['Марк','Если кто-то внутри, он уже слышал нас. Кричать необязательно.']);
 else r.push(['Аня','Ворота открыты, но вокруг нет ни одной машины. Кто-то будто ждал нас.']);break;
case 2:
 if(has(t,['стуч','тук','постуч']))r.push(['Кирилл','Три удара. Я слышал. Но отвечать на них не собираюсь.']);
 else if(has(t,['двер','замок','ключ','откры']))r.push(['Кирилл','Дверь заперта. Давайте сначала осмотрим замок, а не будем ломать её.']);
 else if(has(t,['слуш','тиш','звук']))r.push(['Аня','Теперь тишина. И почему-то от неё ещё тревожнее.']);
 else r.push(['Марк','Надпись старая, но кто-то процарапал её очень глубоко.']);break;
case 3:
 if(has(t,['раздел','разойд','отдельно']))r.push(['Кирилл','Нет. В таком месте не разделяемся.']);
 else if(has(t,['фонар','коридор','осмотр','двер']))r.push(['Кирилл','Слева комнаты, справа лестница. Держитесь в пределах света фонаря.']);
 else r.push(['Аня','Слышите гул за стеной? Он то приближается, то исчезает.']);break;
case 4:
 if(has(t,['кто','имя','откуда','знаешь меня','ответ']))r.push(['Радиоприёмник','— ...если кто-нибудь меня слышит... не отвечайте...']);
 else if(has(t,['выключ','слом','разбить','провод']))r.push(['Кирилл','Не трогай провода. Здесь не должно быть питания, а индикатор всё равно горит.']);
 else if(has(t,['частот','сигнал','радио','настро']))r.push(['Марк','Шкала не двигается, а сигнал есть. Он не похож на обычную передачу.']);
 else r.push(['Аня','Кабели оборваны. Как эта штука вообще работает?']);break;
case 5:
 if(has(t,['включ','слуш','кассет','запис','проигр'])){r.push(['Марк','Тише… На записи кто-то говорит.']);r.push(['Запись с кассеты','— Группа пятнадцать. Станция активирована повторно. Не отвечать на сигнал. Источник не находится внутри станции.']);}
 else if(has(t,['опас','не надо','выключ','риск']))r.push(['Кирилл','Я тоже не в восторге. Но нам нужно понять, что это за место. Держимся вместе.']);
 else r.push(['Аня','На кассете номер 15. Его обвели красным карандашом.']);break;
case 6:
 if(has(t,['журнал','запис','документ','бумаг','папк']))r.push(['Аня','В журнале есть ночные смены уже после официального закрытия станции.']);
 else if(has(t,['карта','план','зал 4','зал четыре']))r.push(['Марк','Нашёл схему. «Зал 4» отмечен красным, но на новой планировке его нет.']);
 else if(has(t,['след','царап','недавно']))r.push(['Кирилл','По пыли видно: недавно передвигали что-то тяжёлое.']);
 else r.push(['Аня','Это не обычная сторожка. Здесь проводили исследования.']);break;
case 7:
 if(has(t,['зал','четыр','маршрут','путь','схем','карта']))r.push(['Марк','Старый план ведёт к залу через технический блок. Но проход на новой схеме отсутствует.']);
 else if(has(t,['уйти','назад','выйти']))r.push(['Кирилл','Попробуем вернуться, но сначала проверим ближайшую комнату. Потом решим все вместе.']);
 else r.push(['Аня','Рядом с «ЗАЛОМ 4» написано: «Не открывать даже при сигнале».']);break;
case 8:
 if(has(t,['откры','ключ','войти']))r.push(['Кирилл','Ключ подходит. Отойди в сторону — я попробую открыть.']);
 else if(has(t,['не откры','опас','ловуш','подожд']))r.push(['Марк','Разумно. За дверью не слышно вообще ничего. Даже эха.']);
 else r.push(['Аня','B-17. Номер совпадает с ключом. Кто-то оставил способ попасть внутрь.']);break;
case 9:
 if(has(t,['лицо','похож','фото','узна','марк']))r.push(['Марк','Снимок старый. Но у человека справа такая же нашивка, как на папке из архива.']);
 else if(has(t,['оборот','надпис','последняя группа','прочита']))r.push(['Аня','«ПОСЛЕДНЯЯ ГРУППА». Что случилось с предыдущими?']);
 else r.push(['Кирилл','Четыре исследователя. Ни одного имени. Словно их намеренно убрали из истории.']);break;
case 10:
 if(has(t,['имя','стёр','стер','кто']))r.push(['Марк','Имя соскоблили намеренно. Бумага повреждена только в этом месте.']);
 else if(has(t,['дата','время','когда']))r.push(['Аня','Последняя запись сделана уже после даты закрытия станции.']);
 else r.push(['Кирилл','В отчёте сказано: оборудование включилось само, а затем из пустых комнат начали отвечать голоса.']);break;
case 11:
 if(has(t,['выход','уйти','назад','двер']))r.push(['Аня','Проверим выход вместе. Не хочу, чтобы мы потеряли друг друга.']);
 else if(has(t,['свет','ламп','электр','выключ']))r.push(['Кирилл','Не трогай выключатели. Система запускается сама.']);
 else r.push(['Марк','Станция включается по цепочке, будто кто-то запускает комнаты одну за другой.']);break;
case 12:
 if(has(t,['кто','откуда','имя','почему','знаешь']))r.push(['Радиоприёмник','— Вы нашли комнату. Вы нашли фотографию. Не открывайте зал четыре.']);
 else if(has(t,['зал','откры']))r.push(['Радиоприёмник','— ...если откроете, услышите то, что ещё не произошло...']);
 else r.push(['Аня','Он знает, что мы нашли фотографию. Мы никому этого не сообщали.']);break;
case 13:
 if(has(t,['спуск','вниз','пойдём','пойдем','идти','откры']))r.push(['Кирилл','Я пойду первым. Держитесь за перила и не отходите от меня.']);
 else if(has(t,['не пойду','остаться','назад','отказ']))r.push(['Марк','Понимаю. Но проход может быть единственным путём к выходу. Давайте хотя бы осмотрим лестницу.']);
 else r.push(['Аня','Снизу гудит огромная машина. Но звук будто идёт не из одного места, а отовсюду.']);break;
case 14:
 if(has(t,['диктофон','запис','включ','осмотр']))r.push(['Марк','На диктофоне одна запись. Дата — сегодняшняя. Это невозможно.']);
 else if(has(t,['не трог','опас','выключ']))r.push(['Кирилл','Никто ничего не трогает. Сначала осмотрим зал.']);
 else r.push(['Аня','Отражатели направлены к центру. Здесь звук не затихает — он возвращается снова и снова.']);break;
case 15:
 if(has(t,['выключ','останов','не слуш','удал']))r.push(['Кирилл','Выключаю. Но я тоже слышал наши голоса. Они говорили о том, что ещё не случилось.']);
 else if(has(t,['голос','будущее','не открывай','это мы']))r.push(['Запись','— Не открывай дверь… Он уже внутри… Мы должны были уйти…']);
 else r.push(['Марк','Это не помехи. Голос похож на мой. Но я ещё не произносил этих слов.']);break;
case 16:
 if(has(t,['двер','выход','замок','откры','сломать']))r.push(['Кирилл','Ручка не двигается. Помогите проверить петли — только вместе.']);
 else if(has(t,['радио','сигнал','помощ','позвать']))r.push(['Радиоприёмник','— ...Лина...']);
 else if(has(t,['аня','успокой','вместе']))r.push(['Аня','Я рядом. Мы не бросим друг друга. Нужно думать и держаться вместе.']);
 else r.push(['Марк','Нас заманили сюда по маршруту. Каждая подсказка вела вниз.']);break;
default:
 if(has(t,['кто','почему','ответ','имя']))r.push(['Радиоприёмник','— Лина. Ты ведь хотела услышать настоящий сигнал?']);
 else if(has(t,['бежать','дверь','открыть','спас']))r.push(['Кирилл','Все ко мне! Не отходите друг от друга!']);
 else if(has(t,['страш','боюсь','не боюсь']))r.push(['Аня','Не нужно быть бесстрашной. Просто не оставайся с этим одна.']);
 else r.push(['Радиоприёмник','— ...теперь слушай внимательно...']);
}
return r}
const intros=[
'Вы подходите к воротам. Ветер гонит сухие листья, а за сеткой что-то едва заметно шевелится.',
'Дверь поддаётся с тяжёлым скрежетом. Три удара повторяются уже изнутри здания.',
'Вы входите в главный коридор. Шаги гулко отдаются от стен, будто станция намного больше снаружи.',
'Вы находите радиорубку. Красный индикатор мигает в такт едва слышному щелчку.',
'Марк открывает ящик под столом. Внутри кассета, покрытая пылью, но её катушки чистые.',
'Вы переходите в архив. На дверце шкафа висит сломанная пломба.',
'На карте проступает маршрут к залу четыре. Часть линии закрыта пятном чернил.',
'За дверью B-17 — тесная комната с металлическим столом и папками.',
'Фотография лежит лицом вниз. Бумага холодная и слегка влажная.',
'Вы раскрываете папку. Последняя страница приклеилась к обложке.',
'Свет вспыхивает резко, и на мгновение станция кажется обитаемой.',
'Радио шипит, будто кто-то стоит за спиной и говорит сквозь стену.',
'За шкафом открывается лестница, уходящая под фундамент станции.',
'Внизу звук становится плотным, почти физическим. В центре зала ждёт диктофон.',
'Запись заканчивается, но магнитофон продолжает вращаться. Из динамика доносится чужой вдох.',
'Вы бросаетесь к выходу. Дверь захлопывается раньше, чем кто-либо успевает пересечь порог.',
'Три удара звучат снова. Теперь они будто доносятся изнутри радиоприёмника.'
];
function next(){if(stage<scenes.length-1){stage++;update();narrator(intros[stage-1]);}else finish()}
function handle(t){user(t);turns++;reply(t).forEach(([n,s])=>line(n,s));if(stage===scenes.length-1){finish();save(false);return}next();save(false)}
function finish(){if(ended)return;ended=true;narrator('Радиоприёмник внезапно замолкает.\\n\\nВ полной тишине слышно, как кто-то медленно приближается к двери.\\n\\nТук… тук… тук.\\n\\nИндикатор гаснет.');narrator('Продолжение следует...');input.disabled=true;$('send').disabled=true;$('bar').style.width='100%';note('Глава завершена. Прогресс сохранён на этом устройстве.');save(false)}
function save(show=true){try{localStorage.setItem(KEY,JSON.stringify({stage,turns,ended,history,html:story.innerHTML}));if(show)note('Прогресс сохранён на этом устройстве.')}catch(e){if(show)note('Браузер не разрешил сохранить прогресс.')}}
function start(){update();try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.history)){stage=d.stage||0;turns=d.turns||0;ended=!!d.ended;history=d.history;story.innerHTML=d.html||'';update();if(ended){input.disabled=true;$('send').disabled=true}note('Сохранение восстановлено на этом устройстве.');return}}catch(e){}
narrator('Четверо друзей — Лина, Аня, Кирилл и Марк — приезжают к заброшенной военной станции на побережье. По документам её закрыли много лет назад. Но несколько ночей подряд на старой частоте появляется сигнал.');
line('Марк','— Координаты точные. Сигнал повторяется каждые двадцать три минуты. Хочу понять, откуда он идёт.');
line('Кирилл','— Осматриваемся вместе. Если что-то не так — сразу уходим.');
line('Аня','— Обещайте только одно: никаких геройских поступков в одиночку.');
narrator('Холодный ветер треплет одежду. Впереди темнеют ворота станции. Что Лина сделает или скажет?')}
$('form').addEventListener('submit',e=>{e.preventDefault();if(ended)return;let t=input.value.trim();if(!t)return;input.value='';handle(t)});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
$('save').addEventListener('click',()=>save(true));
$('restart').addEventListener('click',()=>{if(!confirm('Начать главу заново? Текущее сохранение будет удалено.'))return;localStorage.removeItem(KEY);stage=0;turns=0;ended=false;history=[];story.innerHTML='';input.disabled=false;$('send').disabled=false;start()});
start();
})();
</script></body></html>
