<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Story Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f2f3f5; color:#222; }
    .phone { width:100%; max-width:430px; min-height:100vh; margin:auto; background:#fff; display:flex; flex-direction:column; }
    .header { padding:18px 18px 14px; border-bottom:1px solid #e5e5e5; }
    .title { font-size:20px; font-weight:700; }
    .person { margin-top:5px; font-size:14px; color:#666; }
    .online { color:#28a745; font-weight:600; }
    .chat { flex:1; padding:22px 16px; background:#f7f7f8; display:flex; flex-direction:column; gap:12px; }
    .date { text-align:center; color:#999; font-size:12px; margin-bottom:5px; }
    .message { max-width:78%; padding:11px 14px; border-radius:16px; line-height:1.35; font-size:15px; }
    .him { align-self:flex-start; background:#e7e7eb; border-bottom-left-radius:5px; }
    .me { align-self:flex-end; background:#d8e8ff; border-bottom-right-radius:5px; }
    .time { display:block; margin-top:4px; font-size:10px; color:#888; text-align:right; }
    .input { padding:12px; border-top:1px solid #e5e5e5; display:flex; gap:8px; }
    .fake-input { flex:1; padding:11px 14px; border-radius:20px; background:#f0f0f2; color:#999; font-size:14px; }
    .send { width:42px; height:42px; border:0; border-radius:50%; background:#222; color:white; font-size:18px; }
  </style>
</head>
<body>
  <main class="phone">
    <header class="header">
      <div class="title">💬 ЧАТ №001</div>
      <div class="person">Артём <span class="online">● В сети</span></div>
    </header>
    <section class="chat">
      <div class="date">Сегодня</div>
      <div class="message him">Привет. Ты уже дома?<span class="time">18:21</span></div>
      <div class="message me">Да. А что случилось?<span class="time">18:22</span></div>
      <div class="message him">Ничего… Просто хотел поговорить.<span class="time">18:23</span></div>
    </section>
    <footer class="input">
      <div class="fake-input">Сообщение...</div>
      <button class="send">➤</button>
    </footer>
  </main>
</body>
</html>
