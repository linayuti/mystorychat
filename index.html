<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Глава 1 — Частота</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#eef2f7;font-family:Arial,sans-serif}#app{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}.scene{width:min(920px,100%);min-height:90vh;border:1px solid #26303d;border-radius:18px;overflow:hidden;background:#0d1219}.bg{min-height:90vh;padding:34px 24px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(#07101a55,#07101aee),url('assets/backgrounds/station.jpg') center/cover}.panel{background:#090d13e8;border:1px solid #34404f;border-radius:16px;padding:22px}h1{margin:0 0 10px;font-size:30px}.text{font-size:18px;line-height:1.55;white-space:pre-line}button{display:block;width:100%;margin-top:12px;padding:14px;border:1px solid #4b596a;border-radius:12px;background:#151d27;color:#fff;font-size:16px;text-align:left;cursor:pointer}button:hover{background:#202b39}.small{opacity:.7;font-size:13px;margin-top:14px}.media{margin-top:14px;width:100%;border-radius:10px}</style></head><body><div id="app"></div><script>
const scenes={
start:{title:'ГЛАВА 1 — «Частота»',text:'Четверо друзей приезжают к заброшенной военной станции со звуковыми вышками.\n\nМесто давно отключено от сети, но внутри всё ещё работает один старый прибор.\n\nИз динамика раздаётся короткий сигнал.',choices:[['Войти внутрь станции','inside'],['Сначала осмотреть вышки','towers']]},
inside:{title:'Станция',text:'Дверь открывается с трудом. В коридоре темно, а на стене висит старая схема объекта.\n\nГде-то впереди слышится тихое потрескивание.',choices:[['Идти на звук','signal'],['Изучить схему','map']]},
towers:{title:'Вышки',text:'Одна из вышек выглядит повреждённой. На земле лежит старый блок управления.\n\nНа нём мигает красный индикатор.',choices:[['Поднять блок управления','block'],['Вернуться к станции','inside']]},
signal:{title:'Частота',text:'Звук становится громче. На старом терминале появляется частота: 17.04.\n\nЗатем терминал выводит одно слово: «СЛУШАЙ».',choices:[['Нажать кнопку воспроизведения','voice'],['Остановиться и позвать остальных','friends']]},
map:{title:'Схема',text:'На схеме отмечена подземная часть станции, которой нет на современных планах.\n\nРядом стоит пометка: «Доступ только при активной частоте».',choices:[['Искать вход вниз','basement'],['Вернуться к терминалу','signal']]},
block:{title:'Блок управления',text:'После подключения блока слышится короткий голосовой фрагмент.\n\nПохоже, это запись, сделанная много лет назад.',audio:'assets/audio/recording1.mp3',choices:[['Послушать запись ещё раз','voice'],['Отнести блок внутрь','inside']]},
friends:{title:'Не одни',text:'Остальные подходят к коридору. Теперь сигнал слышат все.\n\nНа секунду свет гаснет — и включается сам старый терминал.',choices:[['Подойти к терминалу','voice'],['Проверить выход','exit']]},
voice:{title:'Запись',text:'В динамике звучит искажённый голос. Слова почти невозможно разобрать.\n\nПосле записи на экране появляется: «ЧАСТОТА ПРИНЯТА».',audio:'assets/audio/voice1.mp3',choices:[['Продолжить','basement'],['Сохранить запись и выйти','exit']]},
basement:{title:'Под землёй',text:'За стеной обнаруживается скрытая лестница. Внизу — помещение с аппаратурой, которая не должна работать без электричества.\n\nНа центральном экране появляется схема четырёх сигналов.',choices:[['Коснуться экрана','end'],['Не трогать оборудование','exit']]},
exit:{title:'Снаружи',text:'Вы выходите из станции. Сигнал стихает, но на телефоне остаётся сохранённая запись.\n\nЧерез несколько секунд телефон снова издаёт тот же самый звук.',choices:[['Посмотреть запись','end']]},
end:{title:'Продолжение следует…',text:'Вы нашли только часть ответа.\n\nСигнал всё ещё существует — и теперь он знает, что вы его услышали.',choices:[]}
};
let scene=localStorage.getItem('chastota_scene')||'start';function render(){const s=scenes[scene];document.getElementById('app').innerHTML=`<main class="scene"><section class="bg"><div class="panel"><h1>${s.title}</h1><div class="text">${s.text}</div>${s.audio?`<audio class="media" controls src="${s.audio}"></audio>`:''}<div id="choices"></div><div class="small">Выборы сохраняются автоматически.</div></div></section></main>`;const c=document.getElementById('choices');s.choices.forEach(([label,next])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{scene=next;localStorage.setItem('chastota_scene',scene);render()};c.appendChild(b)})}render();
</script></body></html>
