<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Частота — интерактивная история</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131d;color:#f1f2fa;font:16px Arial,sans-serif}
header{padding:20px;text-align:center;background:#191e2d;border-bottom:1px solid #343b50}
h1{margin:0;color:#c5b5ff;font-size:27px}
header p{color:#aab1c9;margin:8px 0 0}
main{max-width:760px;margin:auto;padding:14px}
.panel{background:#191e2d;border:1px solid #30374c;border-radius:15px;padding:14px;margin-bottom:13px}
#place{color:#c5b5ff;font-weight:bold}
#chapter{font-size:13px;color:#aab1c9;margin-top:7px}
#story{min-height:250px;max-height:55vh;overflow-y:auto}
.message{display:flex;gap:10px;margin:14px 0;align-items:flex-start}
.avatar{width:43px;height:43px;flex-shrink:0;border-radius:50%;background:#343957;display:grid;place-items:center;font-size:21px}
.bubble{background:#252c40;padding:11px 13px;border-radius:4px 14px 14px 14px;line-height:1.5;overflow-wrap:anywhere;flex:1}
.message.mine{flex-direction:row-reverse}
.message.mine .bubble{background:#393052;border-radius:14px 4px 14px 14px}
.name{font-size:12px;color:#c5b5ff;margin-bottom:5px}
.action{font-style:italic;color:#b6bed5;line-height:1.5;margin:13px 0}
#reply{width:100%;background:#101522;color:white;border:1px solid #414963;border-radius:10px;padding:13px;font-size:16px;margin:8px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 15px;background:#7866ca;color:white;font-size:14px;cursor:pointer}
button.secondary{background:#30374c}
button.danger{background:#8f405a}
button:disabled{opacity:.4}
#status{font-size:12px;color:#aab1c9;margin-top:10px}
#turn{color:#c5b5ff;font-size:14px;margin-bottom:8px}
footer{text-align:center;color:#aab1c9;font-size:12px;padding:18px}
@media(max-width:450px){main{padding:9px}.panel{padding:11px}}
</style>
</head>
<body>
<header>
<h1>Частота</h1>
<p>Интерактивная история</p>
</header>

<main>
<section class="panel">
<div id="place">Берег моря</div>
<div id="chapter">Глава 1 · Сцена 1 из 30</div>
</section>

<section class="panel" id="story" aria-live="polite"></section>

<section class="panel" id="inputPanel">
<div id="turn">Ты играешь за Лину. Напиши сообщение друзьям.</div>
<input id="reply" placeholder="Напиши сообщение..." autocomplete="off">
<div class="controls">
<button id="send">Отправить сообщение</button>
<button id="voice" class="secondary">🎙 Голосовое</button>
</div>
<div id="status">Прогресс сохраняется автоматически.</div>
</section>

<section class="panel">
<div class="controls">
<button class="secondary" id="save">Сохранить прогресс</button>
<button class="danger" id="reset">Пройти заново</button>
<button class="secondary" id="nextChapter">Следующая глава</button>
</div>
</section>

<footer>Ты — Лина. История продолжается вместе с тобой.</footer>
</main>

<script>
const SAVE_KEY="frequency_story_v5";

const scenes=[
{place:"Берег моря",action:"*Вечер. Четверо друзей подходят к заброшенной военной станции.*",talk:[["Марк","Мы точно должны были прийти именно сюда?"],["Кирилл","Тише. Вы слышите этот звук?"],["Аня","Ты сама говорила, что хочешь узнать, что здесь произошло."]]},
{place:"Вход",action:"*Ржавая дверь скрипит, когда Марк толкает её плечом.*",talk:[["Марк","Дверь открыта. Это уже странно."],["Кирилл","На карте вход был отмечен как закрытый."],["Аня","Может, мы всё-таки не будем заходить?"]]},
{place:"Коридор",action:"*Внутри пахнет сыростью. На стенах висят выцветшие таблички.*",talk:[["Аня","Здесь будто всё застыло во времени."],["Марк","Смотрите под ноги. Пол местами провалился."],["Кирилл","В конце коридора есть ещё одна дверь."]]},
{place:"Странный звук",action:"*Из глубины станции доносятся три коротких сигнала.*",talk:[["Марк","Это точно не ветер."],["Кирилл","Но электричество здесь отключили много лет назад."],["Аня","Похоже на радиопомехи."]]},
{place:"Старая карта",action:"*За стеклом лежит пожелтевший план здания.*",talk:[["Кирилл","Вот восточное крыло. Там находился архив."],["Марк","Тогда начнём с него."],["Аня","Погодите. Что это за помещение без номера?"]]},
{place:"Комната охраны",action:"*На столе лежит журнал дежурств с последней записью.*",talk:[["Аня","Записи резко обрываются пятнадцать лет назад."],["Марк","Может, станцию закрыли после аварии."],["Кирилл","Тогда почему в журнале нет ни слова об аварии?"]]},
{place:"Кассета № 15",action:"*В ящике обнаруживается кассета с цифрой 15.*",talk:[["Марк","Кассета. Кто-нибудь захватил магнитофон?"],["Аня","Конечно, нет. Мы же не знали, что найдём."],["Кирилл","В соседней комнате был старый аппарат."]]},
{place:"Магнитофон",action:"*Старый магнитофон щёлкает и начинает шипеть.*",talk:[["Аня","Если оттуда сейчас кто-нибудь заговорит, я уйду."],["Марк","Тише, запись начинается."],["Голос записи","Если вы слышите это сообщение, значит, система снова активна."]]},
{place:"Голос на записи",action:"*Голос на кассете искажается, будто запись повреждена.*",talk:[["Кирилл","Возможно, это предупреждение."],["Голос записи","Не включайте передатчик после третьего сигнала."],["Марк","Какого передатчика?"]]},
{place:"Третий сигнал",action:"*Станция вздрагивает от трёх громких сигналов. Свет на миг вспыхивает.*",talk:[["Аня","Вот они! Три сигнала!"],["Марк","Все назад!"],["Кирилл","Посмотрите на стекло. Там появилась надпись."]]},
{place:"Надпись",action:"*На запотевшем стекле проступают слова: «Найдите источник».*",talk:[["Марк","Кто-то явно хочет, чтобы мы шли дальше."],["Аня","Или хочет заманить нас в ловушку."],["Кирилл","Нужно понять, откуда идёт сигнал."]]},
{place:"Восточное крыло",action:"*Друзья идут по коридору, следуя за тихим гулом.*",talk:[["Аня","Звук становится громче."],["Кирилл","Он идёт будто из-за стены."],["Марк","Значит, там может быть скрытый проход."]]},
{place:"Скрытая панель",action:"*Кирилл замечает металлическую пластину в стене.*",talk:[["Кирилл","На ней тот же символ, что и на кассете."],["Марк","Попробуем нажать?"],["Аня","Только аккуратно, пожалуйста."]]},
{place:"Архив",action:"*За панелью обнаруживается небольшая дверь в архив.*",talk:[["Марк","Вот почему его нет на карте."],["Аня","Сколько же здесь папок!"],["Кирилл","Нам нужна информация о пятнадцатой кассете."]]},
{place:"Дело № 15",action:"*В папке лежат схемы станции и фотографии странных металлических конструкций.*",talk:[["Аня","На снимках станция выглядит совершенно новой."],["Кирилл","Это звуковые зеркала. Они направляли звуковые волны."],["Марк","И все они направлены в одну точку."]]},
{place:"Звуковые зеркала",action:"*На схеме отмечена круглая камера под зданием.*",talk:[["Кирилл","Источник сигнала находится внизу."],["Аня","А мы всё это время слышали его с поверхности?"],["Марк","Тогда нам нужно найти лестницу."]]},
{place:"Лестница вниз",action:"*За архивом находится узкая лестница, уходящая в темноту.*",talk:[["Аня","Почему мне кажется, что это плохая идея?"],["Марк","Потому что мы ничего не знаем об этом месте."],["Кирилл","Будем держаться вместе."]]},
{place:"Нижний уровень",action:"*Внизу холоднее. По стенам тянутся старые кабели.*",talk:[["Кирилл","Система всё ещё получает питание."],["Марк","Но откуда?"],["Аня","Смотрите, там прибор с мигающим экраном!"]]},
{place:"Чужой ответ",action:"*Прибор издаёт два сигнала, словно отвечает на разговор.*",talk:[["Марк","Он реагирует на наши голоса."],["Аня","Может, лучше вообще ничего не говорить?"],["Кирилл","Похоже, он распознаёт звуковые частоты."]]},
{place:"Запертая дверь",action:"*В конце коридора стоит массивная дверь с кодовой панелью.*",talk:[["Марк","Нужен код."],["Кирилл","В архиве были цифры на схеме."],["Аня","Может, номер кассеты — пятнадцать?"]]},
{place:"Код",action:"*После ввода кода панель загорается зелёным светом.*",talk:[["Аня","Она открывается!"],["Марк","Отойдите от двери."],["Кирилл","За ней находится большая камера."]]},
{place:"Акустическая камера",action:"*В круглом зале стоят огромные металлические отражатели.*",talk:[["Кирилл","Это и есть звуковые зеркала."],["Марк","А что находится под защитным стеклом?"],["Аня","Похоже на центральный передатчик."]]},
{place:"Центральный прибор",action:"*На старом экране появляется текущая дата.*",talk:[["Аня","Но эта станция заброшена пятнадцать лет!"],["Марк","Значит, оборудование кто-то поддерживает."],["Кирилл","Или система работает автономно."]]},
{place:"Сообщение",action:"*На экране появляются слова: «Сигнал принят».*",talk:[["Марк","Кем принят?"],["Аня","Может быть, другой станцией?"],["Кирилл","Тогда почему координаты не отображаются?"]]},
{place:"Ответ",action:"*Из динамика раздаётся незнакомый голос.*",talk:[["Неизвестный","Вы наконец пришли."],["Марк","Кто ты? Назови себя!"],["Неизвестный","Не позволяйте им включить передатчик."]]},
{place:"Отключение",action:"*Прибор начинает мигать. На экране появляется предупреждение.*",talk:[["Кирилл","Передатчик запускается!"],["Аня","Как его остановить?"],["Марк","На панели справа есть переключатели!"]]},
{place:"Выбор",action:"*На панели два переключателя и красная кнопка.*",talk:[["Кирилл","Первый блокирует питание, второй — передачу сигнала."],["Марк","Нужно выбрать, что отключить."],["Аня","Главное — не нажимать всё подряд!"]]},
{place:"Тишина",action:"*После отключения передачи гул постепенно затихает.*",talk:[["Марк","Кажется, получилось."],["Кирилл","Мы только прервали сигнал. Система всё ещё работает."],["Аня","Значит, нам придётся сюда вернуться?"]]},
{place:"Последняя запись",action:"*На экране появляется файл «Для тех, кто найдёт станцию».*",talk:[["Неизвестный","Если вы добрались до камеры, первая часть эксперимента завершена."],["Марк","Первая часть? Что это значит?"],["Кирилл","Нужно узнать, кто отправил это сообщение."]]},
{place:"Продолжение следует",action:"*Друзья выходят из станции. На телефоне появляется неизвестное сообщение: «Мы знаем, что вы нашли».*",talk:[["Аня","Это ещё не конец, правда?"],["Марк","Нет. Нам нужно выяснить, кто за этим стоит."],["Кирилл","И что на самом деле произошло пятнадцать лет назад."]]}
];

let state={scene:0,line:0,log:[],finished:false};
let timer=null;
let recognition=null;

const $=id=>document.getElementById(id);
const story=$("story");
const icons={Марк:"🧭",Аня:"🔦",Кирилл:"📡","Голос записи":"📼","Неизвестный":"❔","Лина":"🌊"};

function bubble(name,text){
 const row=document.createElement("div");
 row.className="message"+(name==="Лина"?" mine":"");
 const av=document.createElement("div");
 av.className="avatar";
 av.textContent=icons[name]||"💬";
 const box=document.createElement("div");
 box.className="bubble";
 const label=document.createElement("div");
 label.className="name";
 label.textContent=name;
 const msg=document.createElement("div");
 msg.textContent=text;
 box.append(label,msg);
 row.append(av,box);
 story.append(row);
}
function action(text){
 const el=document.createElement("div");
 el.className="action";
 el.textContent=text;
 story.append(el);
}
function save(show=true){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  if(show)$("status").textContent="Прогресс сохранён.";
 }catch(e){
  $("status").textContent="Не удалось сохранить прогресс.";
 }
}
function addMessage(name,text){
 state.log.push({scene:state.scene,name,text});
}
function addAction(text){
 state.log.push({scene:state.scene,action:true,text});
}
function render(){
 story.innerHTML="";
 const s=scenes[state.scene];
 $("place").textContent=s?s.place:"Продолжение следует…";
 $("chapter").textContent=s?
  `Глава 1 · Сцена ${state.scene+1} из ${scenes.length}`:
  "Глава 1 завершена";
 state.log.forEach(m=>{
  if(m.scene!==state.scene)return;
  if(m.action)action(m.text);
  else bubble(m.name,m.text);
 });
 story.scrollTop=story.scrollHeight;
 $("inputPanel").hidden=!s;
 $("reply").disabled=!s;
 $("send").disabled=!s;
 $("voice").disabled=!s;
 $("nextChapter").disabled=!!s;
 if(s){
  $("turn").textContent="Ты играешь за Лину. Можешь написать сообщение в любой момент.";
 }
 save(false);
}
function scheduleNext(){
 clearTimeout(timer);
 if(state.finished)return;
 timer=setTimeout(showNext,2800);
}
function showNext(){
 clearTimeout(timer);
 const s=scenes[state.scene];
 if(!s)return;
 if(state.line<s.talk.length){
  const [name,text]=s.talk[state.line];
  addMessage(name,text);
  state.line++;
  render();
  scheduleNext();
 }else{
  state.scene++;
  state.line=0;
  if(state.scene>=scenes.length){
   state.finished=true;
   render();
   action("*Продолжение следует…*");
   save(false);
   return;
  }
  addAction(scenes[state.scene].action);
  render();
  scheduleNext();
 }
}
function start(){
 clearTimeout(timer);
 const s=scenes[state.scene];
 if(!s){
  state.finished=true;
  render();
  return;
 }
 if(!state.log.some(m=>m.scene===state.scene&&m.action)){
  addAction(s.action);
 }
 render();
 if(state.line<s.talk.length)scheduleNext();
 else scheduleNext();
}
function answer(text){
 text=text.trim();
 if(!text||state.finished)return;
 clearTimeout(timer);
 addMessage("Лина",text);
 const t=text.toLowerCase();
 let name="Марк";
 let msg="Давайте продолжим осмотр. Здесь ещё многое предстоит узнать.";
 if(/страш|боюсь|жутк|опасно/.test(t)){
  name="Аня";
  msg="Мне тоже тревожно. Давайте держаться вместе.";
 }else if(/кто|голос|человек|сообщ/.test(t)){
  name="Кирилл";
  msg="Пока неизвестно. Нужно найти больше информации.";
 }else if(/сигнал|звук|радио|кассет/.test(t)){
  name="Марк";
  msg="Это может быть связано с экспериментом. Продолжим искать.";
 }else if(/уйти|назад|домой/.test(t)){
  name="Аня";
  msg="Я бы тоже хотела вернуться, но сначала нужно разобраться.";
 }else if(/давай|вместе|пойдём|идём/.test(t)){
  name="Кирилл";
  msg="Согласен. Будем действовать осторожно.";
 }else if(/да|ага|ладно|хорошо/.test(t)){
  name="Марк";
  msg="Хорошо. Тогда не будем терять время.";
 }
 addMessage(name,msg);
 $("reply").value="";
 render();
 $("reply").focus();
 scheduleNext();
}
$("send").onclick=()=>answer($("reply").value);
$("reply").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  e.preventDefault();
  $("send").click();
 }
});
$("voice").onclick=()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  $("status").textContent="Голосовой ввод не поддерживается. Попробуй микрофон на клавиатуре.";
  return;
 }
 try{
  recognition=new SpeechRecognition();
  recognition.lang="ru-RU";
  recognition.interimResults=false;
  recognition.onstart=()=>$("status").textContent="Говори — речь появится в поле сообщения.";
  recognition.onresult=e=>{
   $("reply").value+=($("reply").value?" ":"")+e.results[0][0].transcript;
   $("status").textContent="Проверь текст и нажми «Отправить сообщение».";
  };
  recognition.onerror=()=>$("status").textContent="Не удалось распознать речь. Проверь разрешение на микрофон.";
  recognition.start();
 }catch(e){
  $("status").textContent="Не удалось включить микрофон.";
 }
};
$("save").onclick=()=>save(true);
$("reset").onclick=()=>{
 if(!confirm("Начать историю заново? Сохранённый прогресс будет удалён."))return;
 clearTimeout(timer);
 localStorage.removeItem(SAVE_KEY);
 state={scene:0,line:0,log:[],finished:false};
 start();
 $("status").textContent="История начата заново.";
};
$("nextChapter").onclick=()=>{
 if(!state.finished){
  alert("Сначала закончи первую главу.");
  return;
 }
 alert("Вторая глава пока не добавлена. Продолжение следует…");
};
function load(){
 try{
  const data=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(data&&Number.isInteger(data.scene)&&Array.isArray(data.log)&&
     data.scene>=0&&data.scene<=scenes.length){
   state={...state,...data};
   render();
   if(!state.finished)scheduleNext();
   else{
    action("*Продолжение следует…*");
   }
   return;
  }
 }catch(e){}
 start();
}
load();
</script>
</body>
 </html>
